  <desc>A cobalt and teal ASCII evergreen on a dark navy field.</desc>
  <style>
    .mono { font-family: "IBM Plex Mono", Consolas, "Liberation Mono", monospace; }
    .branch { font-size: 12px; }
    .speck { stroke: #436fd1; stroke-width: 1; }
    .s1 { stroke: #367f86; }
    .s2 { stroke: #334d86; }
    .moving { animation: sway 6s steps(1, end) infinite; }
    @keyframes sway {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(var(--right)); }
      50% { transform: translateX(0); }
      75% { transform: translateX(var(--left)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .moving { animation: none; }
    }
  </style>
