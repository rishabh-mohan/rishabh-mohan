<svg xmlns="http://www.w3.org/2000/svg" width="550" height="197" viewBox="0 0 550 197" role="img">
  <title>rr-scraper terminal demo</title>
  <desc>Illustrative run: search for Clockwork Isles, pick a result, and export all chapters to EPUB.</desc>
  <style>
    text { font-family: ui-monospace, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .step { animation: appear 1ms steps(1, end) both; animation-delay: var(--delay); }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="549" height="196" rx="11" fill="#0e1926" stroke="#37556c"/>
  <path d="M1 36H549" stroke="#294357"/>
  <circle cx="20" cy="18" r="3" fill="#83bbd0"/>
  <text x="32" y="22" font-size="12" fill="#c5d8e4">rr-scraper</text>
  <text x="530" y="22" font-size="11" text-anchor="end" fill="#9bb3c4">EXAMPLE RUN</text>
  <text x="19" y="59" font-size="14" fill="#a6d6e6">$ node chapter-scraper.js</text>
  <text class="step" style="--delay:0.65s" x="19" y="82" font-size="13" fill="#e0eaf2">Enter RoyalRoad URL OR Search Title: Clockwork Isles</text>
  <text class="step" style="--delay:1.3s" x="19" y="105" font-size="14" fill="#e0eaf2">Pick a number (default 1): 1</text>
  <text class="step" style="--delay:1.9500000000000002s" x="19" y="128" font-size="14" fill="#e0eaf2">Save format: 3 (EPUB)</text>
  <text class="step" style="--delay:2.6s" x="19" y="151" font-size="14" fill="#e0eaf2">Chapters per file: all</text>
  <text class="step" style="--delay:3.35s" x="19" y="174" font-size="14" fill="#8fdbbd">Saved: Clockwork Isles.epub</text>
</svg>