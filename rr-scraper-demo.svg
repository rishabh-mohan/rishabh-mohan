<svg xmlns="http://www.w3.org/2000/svg" width="550" height="260" viewBox="0 0 550 260" role="img">
<title>rr-scraper terminal demo</title><desc>Direct Royal Road URL export against the local Book fixture. Selected lines from the run.</desc>
<style>text { font-family: ui-monospace,Consolas,"Liberation Mono",monospace; }
    @media (prefers-reduced-motion: no-preference) { .step { animation: reveal 1ms steps(1,end) both; animation-delay: var(--delay); } }
    @keyframes reveal { from {opacity:0} to {opacity:1} }</style>
<rect x=".5" y=".5" width="549" height="259" rx="11" fill="#0e1926" stroke="#37556c"/><path d="M1 36H549" stroke="#294357"/><circle cx="20" cy="18" r="3" fill="#83bbd0"/><text x="32" y="22" font-size="12" fill="#c5d8e4">rr-scraper</text><text x="530" y="22" font-size="11" text-anchor="end" fill="#9bb3c4">LOCAL FIXTURE RUN</text>
<text x="20" y="60" font-size="14" fill="#a6d6e6">$ node chapter-scraper.js</text>
<text x="20" y="81" font-size="14" fill="#e0eaf2" class="step" style="--delay:0.45s">Enter RoyalRoad URL OR Search Title:</text>
<text x="31" y="102" font-size="14" fill="#e0eaf2" class="step" style="--delay:0.90s">https://www.royalroad.com/fiction/1/book</text>
<text x="20" y="123" font-size="14" fill="#e0eaf2" class="step" style="--delay:1.35s">Novel Title: "Book"</text>
<text x="20" y="144" font-size="14" fill="#e0eaf2" class="step" style="--delay:1.80s">Found 2 total chapters!</text>
<text x="20" y="165" font-size="13" fill="#e0eaf2" class="step" style="--delay:2.25s">Save format: [1] TXT  [2] PDF  [3] EPUB (default 2): 3</text>
<text x="20" y="186" font-size="13" fill="#e0eaf2" class="step" style="--delay:2.70s">Chapters per file (default all, "all" = every chapter):</text>
<text x="20" y="207" font-size="13" fill="#e0eaf2" class="step" style="--delay:3.15s">Saving as EPUB: 1 file(s), up to 2 chapter(s) each.</text>
<text x="20" y="228" font-size="14" fill="#8fdbbd" class="step" style="--delay:3.60s">Saved: Book.epub</text>
</svg>
